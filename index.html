  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #050506; }
  body { font-family: 'Vazirmatn', sans-serif; overscroll-behavior-y: contain; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 320ms ease-out; }
  #loading { position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; }
  #loading img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style>
