<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>پنل مدیریت | jamalvfx_</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;900&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #050506; font-family: 'Vazirmatn', sans-serif; color: #f4f4f6; min-height: 100vh; position: relative; }
  body::before {
    content: '';
    position: fixed;
    inset: -8%;
    z-index: 0;
    background:
      radial-gradient(circle at 8% 96%, rgba(255,251,235,0.85), transparent 26%),
      radial-gradient(circle at 12% 100%, rgba(45,212,191,0.75), transparent 42%),
      linear-gradient(180deg, #050505 0%, #050505 24%, #5a2408 40%, #ff6a00 54%, #ffb703 68%, #f3e08a 80%, #1fb8a3 100%);
    transition: transform 750ms cubic-bezier(0.4,0,0.2,1);
    transform-origin: 50% 100%;
  }
  body.bg-kick::before {
    animation: emberKick 750ms cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes emberKick {
    0%   { transform: scale(1) translate(0, 0); }
    35%  { transform: scale(1.06) translate(1.5%, -1.5%); }
    100% { transform: scale(1) translate(0, 0); }
  }
  #root { min-height: 100vh; position: relative; z-index: 1; }
</style>
</head>
<body>
<div id="root"><div id="loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#8b8b93;font-size:13px;">در حال بارگذاری…</div></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js'"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js'"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js'"></script>
<script>
  (function () {
    function loadAppScript() {
      var s = document.createElement('script');
      s.type = 'text/babel';
      s.src = 'admin.js';
      document.body.appendChild(s);
      if (window.Babel && window.Babel.transformScriptTags) {
        setTimeout(function () { window.Babel.transformScriptTags(); }, 0);
      }
    }
    function whenReady() {
      if (window.React && window.ReactDOM && window.Babel) {
        loadAppScript();
      } else {
        setTimeout(whenReady, 100);
      }
    }
    whenReady();
    setTimeout(function () {
      if (!window.React || !window.ReactDOM || !window.Babel) {
        var el = document.getElementById('loading');
        if (el) el.textContent = 'مشکلی در اتصال پیش اومد. لطفاً فیلترشکن رو روشن/خاموش کن و صفحه رو رفرش کن.';
      }
    }, 12000);
  })();
</script>
</body>
</html>
